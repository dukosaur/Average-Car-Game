<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#14233d" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Sleek rounded app badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#334155" stroke-width="1.5" />

  <!-- Subtle speed horizon arc -->
  <path d="M10 49 C22 39, 42 39, 54 49" fill="none" stroke="url(#road)" stroke-width="2.6" stroke-linecap="round" opacity="0.9" />
  <path d="M17 54 L47 54" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

  <!-- Aggressive low-poly front-profile sports car -->
  <!-- Roof & windshield -->
  <polygon points="21,21 43,21 48,30 16,30" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round" />
  <!-- Main widebody hood & fenders -->
  <polygon points="10,33 16,29 48,29 54,33 52,41 12,41" fill="url(#body)" />
  <!-- Center racing stripe accent -->
  <polygon points="29.5,29 34.5,29 35.5,41 28.5,41" fill="#2563eb" />
  <!-- Front grille cutout -->
  <polygon points="22,36 42,36 40,40.5 24,40.5" fill="#090d16" />
  <!-- Crisp glowing LED headlights -->
  <polygon points="12.5,33.5 19.5,34.5 18.5,37 13,36.5" fill="#38bdf8" />
  <polygon points="51.5,33.5 44.5,34.5 45.5,37 51,36.5" fill="#38bdf8" />
  <!-- Subtle red splitter accent -->
  <line x1="15" y1="42" x2="49" y2="42" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
</svg>
